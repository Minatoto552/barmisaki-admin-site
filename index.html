<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BarMisaki Manage</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(124, 58, 237, .18), transparent 42%),
        linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      color: #0f172a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    main {
      width: min(100%, 440px);
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 24px 80px rgba(15,23,42,.12);
      padding: 32px;
      text-align: center;
    }
    .mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #7c3aed;
      color: white;
      font-weight: 800;
      font-size: 22px;
    }
    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 32px);
      letter-spacing: .02em;
    }
    p {
      margin: 16px 0 24px;
      color: #64748b;
      line-height: 1.8;
    }
    form {
      display: grid;
      gap: 12px;
      text-align: left;
    }
    label {
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      color: #0f172a;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .18em;
      padding: 0 16px;
      text-align: center;
      outline: none;
    }
    input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, .14);
    }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background: #0f172a;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }
    button:hover { background: #7c3aed; }
    .error {
      min-height: 22px;
      margin: 2px 0 0;
      color: #dc2626;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">M</div>
    <h1>BarMisaki 運営サイト</h1>
    <p>運営サイトへ進むにはパスワードを入力してください。</p>
    <form id="gate" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="••••" aria-describedby="error" autofocus />
      <button type="submit">運営サイトへ進む</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const targetUrl = './dashboard/';
    const expectedHash = 'd2d8f9273e06e9e9c574d1681d0c664bb92716dc71883c051256b2cda975e757';
    const gate = document.getElementById('gate');
    const password = document.getElementById('password');
    const error = document.getElementById('error');

    async function sha256(value) {
      const bytes = new TextEncoder().encode(value);
      const hash = await crypto.subtle.digest('SHA-256', bytes);
      return [...new Uint8Array(hash)].map((byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    gate.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      const inputHash = await sha256(password.value.trim());

      if (inputHash === expectedHash) {
        window.location.href = targetUrl;
        return;
      }

      password.value = '';
      password.focus();
      error.textContent = 'パスワードが違います。';
    });
  </script>
</body>
</html>
